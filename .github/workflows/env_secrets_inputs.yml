name: Demo CI Env Secrets

on:
  #push
  workflow_dispatch:

# The below is global level environmental variable.
env:
  GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest

    # job level environmental variable.
    env:
      JOB_APP_ENV: job-dev

    steps:
      - name: Say Hello
        run: echo "Hello from second workflow!"

      - name: Install
        env:
          APP_ENV: demo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD , $GLOBAL_APP_ENV, $JOB_APP_ENV"
